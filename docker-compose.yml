services:
  expense-tracker:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Named volume: sauber isoliert von der lokalen Entwicklungsdatenbank
      - expense_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data

volumes:
  expense_data:
